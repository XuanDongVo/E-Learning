spring.application.name=server
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

# Activity XP rollout: only newly started sessions are bound when enabled.
gamification.activity-xp.enabled=${ACTIVITY_XP_ENABLED}

# Multipart upload limits. Keep the request limit slightly above the file limit
# for multipart boundaries and metadata.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# PostgreSQL: credentials and URL must be injected by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JWT: never embed signing secrets in source control.
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.access-token-expire=${JWT_ACCESS_TOKEN_EXPIRE}
jwt.refresh-token-expire=${JWT_REFRESH_TOKEN_EXPIRE}
jwt.cookie-secure=${JWT_COOKIE_SECURE}

# Comma-separated exact frontend origins. Production must provide its HTTPS origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cloudinary: use separate credentials per environment.
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

# Content media validation
content.media.rules.IMAGE.max-size-bytes=${CONTENT_IMAGE_MAX_SIZE_BYTES:5242880}
content.media.rules.IMAGE.allowed-mime-types=${CONTENT_IMAGE_ALLOWED_MIME_TYPES:image/jpeg,image/png}
content.media.rules.AUDIO.max-size-bytes=${CONTENT_AUDIO_MAX_SIZE_BYTES:10485760}
content.media.rules.AUDIO.allowed-mime-types=${CONTENT_AUDIO_ALLOWED_MIME_TYPES:audio/mpeg,audio/wav,audio/x-wav}
