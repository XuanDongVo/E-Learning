spring.application.name=server

logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

# Multipart upload limits. Keep the request limit slightly above the file limit
# for multipart boundaries and metadata.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# DATASOURCE - POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/e_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

#JWT
jwt.base64-secret=${JWT_BASE64_SECRET:tybBIQtqJWNdlTayWJmWt6v5xOoYq4W6g/iBY6XZp+aLRMNhwpXhvRth4nravWlrn5cVbWfwtUXshmnW7+ZjGg==}
jwt.access-token-expire=${JWT_ACCESS_TOKEN_EXPIRE:3600}
jwt.refresh-token-expire=${JWT_REFRESH_TOKEN_EXPIRE:604800}
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

#CLOUDINARY
cloudinary.cloud-name=${CLOUD_NAME:ddqre1ndq}
cloudinary.api-key=${API_KEY:232253493552488}
cloudinary.api-secret=${API_SECRET:}

# Content media validation
content.media.rules.IMAGE.max-size-bytes=${CONTENT_IMAGE_MAX_SIZE_BYTES:5242880}
content.media.rules.IMAGE.allowed-mime-types=${CONTENT_IMAGE_ALLOWED_MIME_TYPES:image/jpeg,image/png}
content.media.rules.AUDIO.max-size-bytes=${CONTENT_AUDIO_MAX_SIZE_BYTES:10485760}
content.media.rules.AUDIO.allowed-mime-types=${CONTENT_AUDIO_ALLOWED_MIME_TYPES:audio/mpeg,audio/wav,audio/x-wav}