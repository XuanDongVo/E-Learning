name: e-learning

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks: [internal]

  frontend:
    build:
      context: ./client-e-learning
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"
    networks: [internal]

  seed:
    image: postgres:16-alpine
    profiles:
      - seed

    restart: "no"

    depends_on:
      db:
        condition: service_healthy

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SEED_CONFIRM: ${SEED_CONFIRM:-}

    volumes:
      - ./server/src/test/resources/db/seed/grade7:/seed/sql:ro
      - ./docker/seed/run.sh:/seed/run.sh:ro

    entrypoint: ["/bin/sh", "/seed/run.sh"]

    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

volumes:
  postgres-data:

networks:
  internal:
    driver: bridge
